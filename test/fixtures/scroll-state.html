<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ImageGuide scroll-state fixture</title>
    <style>.spacer { height: 1400px; }</style>
  </head>
  <body>
    <img id="initial" src="/icons/icon128.png?initial=1" width="128" height="128" alt="Initial image" />
    <div class="spacer"></div>
    <img id="current" src="/icons/icon128.png?current=1" width="128" height="128" loading="lazy" alt="Current image" />
  </body>
</html>
