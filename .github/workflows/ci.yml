name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    name: Unit and static checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      PUPPETEER_SKIP_DOWNLOAD: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  chromium:
    name: Extension E2E (${{ matrix.os }}, ${{ matrix.browser }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            browser: chrome-for-testing
            channel: ''
            skip_download: 'false'
          - os: macos-latest
            browser: chrome-for-testing
            channel: ''
            skip_download: 'false'
          - os: windows-latest
            browser: chrome-for-testing
            channel: ''
            skip_download: 'false'
          - os: ubuntu-latest
            browser: chrome-stable
            channel: chrome
            skip_download: 'true'
    env:
      CI: true
      IMAGEGUIDE_CHROME_CHANNEL: ${{ matrix.channel }}
      PUPPETEER_SKIP_DOWNLOAD: ${{ matrix.skip_download }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  package:
    name: Package release ZIP
    needs: [unit, chromium]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: bash scripts/build-zip.sh
      - uses: actions/upload-artifact@v4
        with:
          name: imageguide-extension
          path: dist/*.zip
          if-no-files-found: error
